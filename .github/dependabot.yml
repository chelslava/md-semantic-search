# Dependabot configuration (issue #122): weekly grouped updates for npm and
# the GitHub Actions used by our workflows.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
    open-pull-requests-limit: 5
