name: publish

# Publish to npm when a version tag (v1.2.3) is pushed.
# Requires a repo secret NPM_TOKEN — an npm *automation* / granular token with
# "bypass 2FA" enabled (Account → Access Tokens on npmjs.com).

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release and upload the SBOM asset
      id-token: write   # enables npm provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "Publishing version $PKG"

      - name: Ensure GitHub Release exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} already exists"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "mdss ${GITHUB_REF_NAME}" \
              --verify-tag \
              --generate-notes || true
          fi

      - name: Publish
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if npm view "md-semantic-search@${TAG}" version > /dev/null 2>&1; then
            echo "md-semantic-search@${TAG} is already on npm — skipping publish (rerun-safe)"
            exit 0
          fi
          if ! npm publish --access public --provenance; then
            # a version published seconds ago can 409 ("previously staged")
            # before `npm view` sees it — verify before failing
            if npm view "md-semantic-search@${TAG}" version > /dev/null 2>&1; then
              echo "md-semantic-search@${TAG} landed (staged-publish lag) — rerun-safe skip"
              exit 0
            fi
            exit 1
          fi

      - name: Generate CycloneDX SBOM (issue #122)
        run: npm sbom --sbom-format cyclonedx > mdss-sbom.cdx.json

      - name: Upload SBOM to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" "mdss-sbom.cdx.json" \
            --clobber \
            --repo "${GITHUB_REPOSITORY}"

  vscode-extension:
    permissions:
      contents: write   # needed to create the release (if missing) and upload assets
    # Build the .vsix and attach it to the GitHub Release. The release is
    # created on demand (rerun-safe); the asset upload uses --clobber so
    # repeated runs are safe.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ensure GitHub Release exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} already exists"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "mdss ${GITHUB_REF_NAME}" \
              --verify-tag \
              --generate-notes || true
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Verify VS Code extension version matches tag
        shell: bash
        working-directory: integrations/vscode
        run: |
          EXT=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$EXT" != "$TAG" ]; then
            echo "::error::integrations/vscode/package.json version $EXT does not match tag v$TAG"
            exit 1
          fi
          echo "Building VS Code extension v$EXT"

      - name: Build VS Code extension
        working-directory: integrations/vscode
        run: |
          npm install
          vsce package --no-dependencies --out "md-semantic-search-vscode-${GITHUB_REF_NAME#v}.vsix"

      - name: Upload .vsix to GitHub Release
        shell: bash
        working-directory: integrations/vscode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VSIX="md-semantic-search-vscode-${GITHUB_REF_NAME#v}.vsix"
          gh release upload "${GITHUB_REF_NAME}" "$VSIX" \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

  mcp-registry:
    name: Publish to the MCP Registry
    # Issue #275 follow-up: the registry submission is part of every release
    # (CONTRIBUTING, "Releasing to the MCP Registry"). Authentication is
    # GitHub Actions OIDC — no stored secret to expire (the #258 NPM_TOKEN
    # lesson); the registry derives the io.github.chelslava/… namespace from
    # this repository. Needs the npm package LIVE first: the registry
    # validates npm identifier/version/mcpName ownership.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # GitHub OIDC exchange for the registry session
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify server.json matches the tag
        shell: bash
        run: |
          SRV=$(node -p "require('./server.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$SRV" != "$TAG" ]; then
            echo "::error::server.json version $SRV does not match tag v$TAG"
            exit 1
          fi
          echo "Registry submission: io.github.chelslava/md-semantic-search@$SRV"

      - name: Install mcp-publisher (checksum-verified)
        shell: bash
        env:
          PUBLISHER_VERSION: v1.8.9
        run: |
          mkdir publisher
          curl -sfL -o publisher/pub.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          curl -sfL -o publisher/checksums.txt \
            "https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/registry_${PUBLISHER_VERSION#v}_checksums.txt"
          # exact-file anchor: the sigstore.json sibling shares the name as a prefix
          HASH=$(grep -E 'mcp-publisher_linux_amd64\.tar\.gz$' publisher/checksums.txt | awk '{print $1}')
          echo "${HASH}  publisher/pub.tar.gz" | sha256sum -c -
          tar -xzf publisher/pub.tar.gz -C publisher
          publisher/mcp-publisher --version

      - name: Wait for the npm package to go live
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          for i in $(seq 1 24); do
            if curl -sf "https://registry.npmjs.org/md-semantic-search/${VERSION}" | grep -q "\"version\":\"${VERSION}\""; then
              echo "md-semantic-search@${VERSION} is live on npm"
              exit 0
            fi
            echo "waiting for npm CDN propagation (attempt $i/24)…"
            sleep 5
          done
          echo "::error::md-semantic-search@${VERSION} not visible on npm after 2 minutes"
          exit 1

      - name: Publish to the registry (OIDC, rerun-safe)
        shell: bash
        run: |
          if curl -sf "https://registry.modelcontextprotocol.io/v0.1/servers?search=io.github.chelslava%2Fmd-semantic-search" | grep -q "\"version\":\"${GITHUB_REF_NAME#v}\""; then
            echo "registry already lists ${GITHUB_REF_NAME} — skipping (rerun-safe)"
            exit 0
          fi
          publisher/mcp-publisher login github-oidc
          publisher/mcp-publisher publish


