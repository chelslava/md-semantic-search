name: publish

# Publish to npm when a version tag (v1.2.3) is pushed.
# Requires a repo secret NPM_TOKEN — an npm *automation* / granular token with
# "bypass 2FA" enabled (Account → Access Tokens on npmjs.com).

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release and upload the SBOM asset
      id-token: write   # enables npm provenance attestation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "Publishing version $PKG"

      - name: Ensure GitHub Release exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} already exists"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "mdss ${GITHUB_REF_NAME}" \
              --verify-tag \
              --generate-notes
          fi

      - name: Publish
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if npm view "md-semantic-search@${TAG}" version > /dev/null 2>&1; then
            echo "md-semantic-search@${TAG} is already on npm — skipping publish (rerun-safe)"
            exit 0
          fi
          npm publish --access public --provenance

      - name: Generate CycloneDX SBOM (issue #122)
        run: npm sbom --sbom-format cyclonedx > mdss-sbom.cdx.json

      - name: Upload SBOM to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" "mdss-sbom.cdx.json" \
            --clobber \
            --repo "${GITHUB_REPOSITORY}"

  vscode-extension:
    permissions:
      contents: write   # needed to create the release (if missing) and upload assets
    # Build the .vsix and attach it to the GitHub Release. The release is
    # created on demand (rerun-safe); the asset upload uses --clobber so
    # repeated runs are safe.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Ensure GitHub Release exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} already exists"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "mdss ${GITHUB_REF_NAME}" \
              --verify-tag \
              --generate-notes
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Verify VS Code extension version matches tag
        shell: bash
        working-directory: integrations/vscode
        run: |
          EXT=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$EXT" != "$TAG" ]; then
            echo "::error::integrations/vscode/package.json version $EXT does not match tag v$TAG"
            exit 1
          fi
          echo "Building VS Code extension v$EXT"

      - name: Build VS Code extension
        working-directory: integrations/vscode
        run: |
          npm install
          vsce package --no-dependencies --out "md-semantic-search-vscode-${GITHUB_REF_NAME#v}.vsix"

      - name: Upload .vsix to GitHub Release
        shell: bash
        working-directory: integrations/vscode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VSIX="md-semantic-search-vscode-${GITHUB_REF_NAME#v}.vsix"
          gh release upload "${GITHUB_REF_NAME}" "$VSIX" \
            --clobber \
            --repo "$GITHUB_REPOSITORY"


