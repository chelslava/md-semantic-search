name: ui-smoke

# Opt-in Playwright smoke for the built-in web UI (issue #111).
# Heavy (downloads Chromium), so it does NOT run on every push:
#   - weekly scheduled sweep alongside the audit
#   - manual workflow_dispatch
# The repo itself carries no playwright dependency — it is installed here.

on:
  workflow_dispatch:
  schedule:
    - cron: '43 5 * * 1'

permissions:
  contents: read

jobs:
  playwright-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript source
        run: npm run build

      - name: Install Playwright (Chromium)
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Web UI Playwright smoke
        run: node e2e/webui.mjs
