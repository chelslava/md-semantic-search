name: docker

# Build & publish the official GHCR image (issue #126) on version tags:
# multi-arch (amd64 + arm64), with an arm64 smoke run. Also build-only on
# pushes touching Dockerfile/compose to catch drift early.

on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['Dockerfile', 'compose.yaml', '.github/workflows/docker.yml']

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=edge,enable=${{ github.event_name == 'pull_request' }}

      - name: Build (and push on tag)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke-arm64:
    # Acceptance: arm64 image builds and passes a serve/health smoke.
    runs-on: ubuntu-latest
    needs: build-push
    if: github.event_name == 'push'
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Smoke arm64 (build + /health)
        run: |
          docker run --rm --platform linux/arm64 \
            ghcr.io/${{ github.repository }}:${{ github.ref_name }} \
            node bin/cli.mjs --version



