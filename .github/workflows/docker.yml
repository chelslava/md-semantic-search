name: docker

# Build & publish the official GHCR image (issue #126) on version tags:
# multi-arch (amd64 + arm64), with an arm64 smoke run. Also build-only on
# pushes touching Dockerfile/compose to catch drift early.

on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['Dockerfile', 'compose.yaml', '.github/workflows/docker.yml']

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    # The emulated (QEMU) linux/arm64 npm ci dominates the wall clock since
    # transformers 4.3.x pulled in sharp 0.35.x + onnxruntime-node 1.30.x;
    # 25 min timed out mid-install (issue #17 follow-up).
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=edge,enable=${{ github.event_name == 'pull_request' }}

      - name: Build (and push on tag)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke-arm64:
    # Acceptance: arm64 image builds and passes a serve/health smoke.
    runs-on: ubuntu-latest
    needs: build-push
    if: github.event_name == 'push'
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Smoke arm64 (build + /health)
        run: |
          docker run --rm --platform linux/arm64 \
            ghcr.io/${{ github.repository }}:${{ github.ref_name }} \
            node bin/cli.mjs --version



