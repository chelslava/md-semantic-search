name: nightly-real-model

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  real-transformers-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    env:
      MDSS_NIGHTLY_CACHE_DIR: ${{ github.workspace }}/.cache/mdss-nightly
      MDSS_RUN_NIGHTLY_REAL_MODEL: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Restore Transformers.js model cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.cache/mdss-nightly
          key: mdss-real-model-${{ runner.os }}-node20-${{ hashFiles('package-lock.json', 'src/core.mjs', 'src/models.mjs', 'src/rerank.mjs', 'test/nightly-real-model.mjs') }}

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript source
        run: npm run build

      - name: Run real Transformers.js smoke suite
        run: node --test test/nightly-real-model.mjs

      - name: Real-model packed-CLI provenance smoke (issue #55)
        env:
          MDSS_RUN_REAL_MODEL: '1'
          MDSS_NIGHTLY_CACHE_DIR: ${{ github.workspace }}/.cache/mdss-nightly
        run: node scripts/verify-pack.mjs


