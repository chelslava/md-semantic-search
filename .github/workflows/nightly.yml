name: nightly-real-model

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  real-transformers-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    env:
      MDSS_NIGHTLY_CACHE_DIR: ${{ github.workspace }}/.cache/mdss-nightly
      MDSS_RUN_NIGHTLY_REAL_MODEL: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Restore Transformers.js model cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.cache/mdss-nightly
          key: mdss-real-model-${{ runner.os }}-node20-${{ hashFiles('package-lock.json', 'src/core.mjs', 'src/models.mjs', 'src/rerank.mjs', 'test/nightly-real-model.mjs') }}

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript source
        run: npm run build

      - name: Run real Transformers.js smoke suite
        run: node --test test/nightly-real-model.mjs

      - name: Real-model packed-CLI provenance smoke (issue #55)
        env:
          MDSS_RUN_REAL_MODEL: '1'
          MDSS_NIGHTLY_CACHE_DIR: ${{ github.workspace }}/.cache/mdss-nightly
        run: node scripts/verify-pack.mjs

      - name: Golden-set retrieval gate (issue #198)
        run: node scripts/run-bench.mjs --slice dev --gate bench/fixtures/golden-baseline.json --cache-dir "$MDSS_NIGHTLY_CACHE_DIR"

      - name: E2E latency benchmark report + regression gate (issue #196)
        run: node bench/e2e.mjs --compare bench/fixtures/e2e-latency-baseline.json --tolerance-pct 20
        # The committed baseline is machine-relative (bench/fixtures/e2e-latency-baseline.json
        # records the hardware it was taken on). The gate only makes sense on matching
        # runner hardware — enable it via the MDSS_E2E_COMPARE repo variable; without
        # it the step runs in report-only mode (numbers go to the job summary).
        if: ${{ vars.MDSS_E2E_COMPARE == '1' }}

      - name: E2E latency benchmark report (issue #196, report-only)
        run: node bench/e2e.mjs
        if: ${{ vars.MDSS_E2E_COMPARE != '1' }}

      - name: Real chat-backend streaming smoke (issue #199; needs repo variable MDSS_SMOKE_ENDPOINT)
        if: ${{ vars.MDSS_SMOKE_ENDPOINT != '' }}
        run: >-
          node scripts/smoke-chat-backend.mjs
          --endpoint "${{ vars.MDSS_SMOKE_ENDPOINT }}"
          ${{ vars.MDSS_SMOKE_PROVIDER && format('--provider {0}', vars.MDSS_SMOKE_PROVIDER) || '' }}
          ${{ vars.MDSS_SMOKE_MODEL && format('--model {0}', vars.MDSS_SMOKE_MODEL) || '' }}
          --timeout-ms 30000


