name: ci

# Run the test suite and a cheap syntax lint on every push / PR.
# Tests use a fake embedder (no model download), so the suite is network-free
# and fast. Node >=20.9 is the minimum supported by the CLI (see README);
# the floor follows sharp 0.35.x via @huggingface/transformers 4.3.x.

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    # Weekly supply-chain sweep (issue #122): the same gate runs scheduled so
    # newly disclosed advisories surface even without pushes.
    - cron: '23 4 * * 1'

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci

      - name: Run tests and collect coverage
        run: NODE_DISABLE_COLORS=1 npm run test:coverage | tee test-output.txt

      - name: Post coverage summary
        if: always()
        run: |
          echo "### Code Coverage" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`text" >> $GITHUB_STEP_SUMMARY
          sed -n '/start of coverage report/,/end of coverage report/p' test-output.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  lint:
    permissions:
      contents: read
    # Type-checks every source module via JSDoc (// @ts-check + checkJs).
    # The repo carries no ESLint config; tsc --noEmit is the linter.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Type-check source modules (tsc --noEmit)
        run: npm run lint

      - name: Integration manifests + protocol sync (issue #112)
        run: node scripts/check-integration-manifests.mjs

  golden-smoke:
    permissions:
      contents: read
    # Issue #56: the golden-set harness must at least RUN in CI (fixture schema
    # valid, frozen corpus hash matches, fake embedder pipeline works end to
    # end). Uses --fake so no model is downloaded and CI stays network-free.
    # Real-model eval numbers are produced locally / on demand (see RESEARCH.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript source
        run: npm run build

      - name: Golden-set smoke (fixture + fake embedder, offline)
        run: node scripts/run-bench.mjs --fast --fake --json

  provenance:
    permissions:
      contents: read
    # Issue #55: prove the PACKED artifact (what npm installs) — not just the
    # source tree — is what runs. Packs, installs into an isolated prefix, and
    # smokes the real installed mdss shim: --version matches package.json,
    # --help exposes the current commands/options, the installed library has
    # the documented exports. The real-model index→stats→check smoke is gated
    # behind MDSS_RUN_REAL_MODEL (scheduled job) so push/PR CI stays
    # network-free and fast.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Verify packed CLI provenance and installed exports
        run: node scripts/verify-pack.mjs

  audit:
    permissions:
      contents: read
    # Issue #17: gate production dependency vulnerabilities against a dated baseline.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Report production dependency vulnerabilities
        run: node scripts/audit-ci.mjs



